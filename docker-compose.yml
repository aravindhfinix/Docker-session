version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: docker-session-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: testdb
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: docker-session-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Node.js Application
  app:
    build: .
    container_name: docker-session-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mongodb
      - redis
    networks:
      - app-network
    volumes:
      - .:/app
      - /app/node_modules

# Volumes for data persistence
volumes:
  mongodb_data:
  redis_data:

# Network for service communication
networks:
  app-network:
    driver: bridge

